<div class="space-y-8 animate-in fade-in duration-300">
  
  <!-- Header -->
  <div class="border-b border-slate-200/60 dark:border-slate-800/60 pb-6 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">
        SMS & WhatsApp Communication Hub
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Directly dispatch clinical reminders, advisory messages, and digitized invoices to dairy farmers.
      </p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- Left: Direct Farmer Message -->
    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border border-slate-200/60 dark:border-slate-800/60 rounded-2xl p-6 shadow-sm space-y-5 flex flex-col justify-between">
      <div class="space-y-4">
        <div class="flex items-center space-x-3 border-b border-slate-100 dark:border-slate-800 pb-3">
          <div class="w-9 h-9 rounded-xl bg-blue-100 dark:bg-blue-950/60 flex items-center justify-center text-blue-600 dark:text-blue-400 font-bold">
            💬
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Direct Message to Farmer</h2>
            <p class="text-xs text-slate-400">Send custom clinical or vaccination announcements.</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Select Farmer *</label>
          <select [ngModel]="selectedFarmerId()" (ngModelChange)="selectedFarmerId.set($event)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
            <option value="">-- Choose Recipient Farmer --</option>
            <option *ngFor="let f of dataService.farmers()" [value]="f.id">
              {{ f.name }} ({{ f.mobile }}) • {{ f.village || 'Gujarat' }}
            </option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Custom Message Text</label>
          <textarea [ngModel]="messageText()" (ngModelChange)="messageText.set($event)" rows="5" placeholder="Type message to farmer..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"></textarea>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center space-x-3">
        <button (click)="sendDirectWA()" type="button" class="flex-1 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer">
          <span>💬</span>
          <span>Send via WhatsApp</span>
        </button>
        <button (click)="sendDirectSMS()" type="button" class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer">
          <span>📱</span>
          <span>Send via SMS</span>
        </button>
      </div>
    </div>

    <!-- Right: Bill / Service Receipt Dispatcher -->
    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border border-slate-200/60 dark:border-slate-800/60 rounded-2xl p-6 shadow-sm space-y-5 flex flex-col justify-between">
      <div class="space-y-4">
        <div class="flex items-center space-x-3 border-b border-slate-100 dark:border-slate-800 pb-3">
          <div class="w-9 h-9 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 flex items-center justify-center text-emerald-600 dark:text-emerald-400 font-bold">
            🧾
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Bill & Receipt Dispatcher</h2>
            <p class="text-xs text-slate-400">Transmit digital receipt for AI, PD, or surgery.</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Select Bill Entry</label>
          <select [ngModel]="selectedBillId()" (ngModelChange)="selectedBillId.set($event)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
            <option value="">-- Choose Bill Record --</option>
            <option *ngFor="let b of dataService.bills()" [value]="b.id">
              {{ b.billno }} • {{ b.date }} • {{ dataService.getFarmerName(b.farmer) }} (₹{{ b.amount }})
            </option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Formatted Message Preview</label>
          <textarea [value]="billAsciiMessage" readonly rows="5" placeholder="Select a bill above to view generated message..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-300 text-xs font-mono focus:outline-none"></textarea>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center space-x-3">
        <button (click)="sendBillViaWA()" type="button" [disabled]="!selectedBill" class="flex-1 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold rounded-xl text-sm shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer">
          <span>💬</span>
          <span>Bill via WhatsApp</span>
        </button>
        <button (click)="sendBillViaSMS()" type="button" [disabled]="!selectedBill" class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer">
          <span>📱</span>
          <span>Bill via SMS</span>
        </button>
      </div>
    </div>

  </div>

</div>
