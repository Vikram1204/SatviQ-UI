<div *ngIf="isOpen" class="fixed inset-0 z-[120] overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6 animate-in fade-in zoom-in duration-200">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 flex items-center justify-center text-emerald-600 dark:text-emerald-400 font-bold">
          🔒
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Change Account Password</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400">Update password (stored with SHA-256 encryption)</p>
        </div>
      </div>
      <button (click)="onClose()" class="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="px-4 py-3 rounded-xl bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-xs font-semibold text-red-700 dark:text-red-300">
      {{ errorMessage() }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Current Password *</label>
        <input 
          type="password" 
          [(ngModel)]="oldPassword" 
          name="oldPassword" 
          required 
          placeholder="Enter current password" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
        >
      </div>

      <div>
        <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">New Password *</label>
        <input 
          type="password" 
          [(ngModel)]="newPassword" 
          name="newPassword" 
          required 
          placeholder="At least 4 characters" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
        >
      </div>

      <div>
        <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Confirm New Password *</label>
        <input 
          type="password" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword" 
          required 
          placeholder="Re-enter new password" 
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
        >
      </div>

      <!-- Actions -->
      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end space-x-3">
        <button (click)="onClose()" type="button" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="isLoading()" class="px-5 py-2 rounded-xl text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-500/20 transition-all disabled:opacity-50">
          {{ isLoading() ? 'Updating...' : 'Update Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
