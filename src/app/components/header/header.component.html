<header 
  [ngClass]="{
    'bg-white/80 dark:bg-slate-950/80 py-6': !isScrolled,
    'bg-white/95 dark:bg-slate-950/95 py-4 shadow-md': isScrolled,
    'lg:left-20': isSidebarCollapsed,
    'lg:left-64': !isSidebarCollapsed
  }"
  class="fixed top-0 left-0 right-0 z-30 border-b border-slate-200/50 dark:border-slate-800/50 backdrop-blur-md transition-all duration-300 ease-in-out"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between">
      
      <!-- Logo Section -->
      <a href="/" class="flex items-center space-x-3 group lg:hidden">
        <div class="relative flex items-center justify-center w-11 h-11 rounded-full overflow-hidden border border-emerald-500/30 shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-all duration-300 bg-slate-950">
          <!-- Logo image: Cropped to show only the animal/clinical circular badge and hide bottom text -->
          <img 
            src="/logo.jpg" 
            alt="SatviQ Logo" 
            class="absolute w-full h-full object-cover"
          >
        </div>
        <span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-600 via-teal-600 to-blue-600 dark:from-emerald-400 dark:via-teal-400 dark:to-blue-400 bg-clip-text text-transparent group-hover:from-emerald-500 group-hover:to-blue-500 transition-colors duration-300">
          SatviQ
        </span>
      </a>

      <!-- Desktop Page Title (Visible on Desktop >= lg) -->
      <div class="hidden lg:flex items-center space-x-3">
        <div class="w-2.5 h-6 bg-gradient-to-b from-emerald-500 to-teal-600 rounded-full shadow-sm"></div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">
          {{ getPageTitle() }}
        </h1>
      </div>

      <!-- Action Buttons (Visible on Mobile & Desktop) -->
      <div class="flex items-center space-x-2 sm:space-x-4 ml-auto">
        
        <!-- Dark/Light Theme Toggle -->
        <button 
          (click)="toggleTheme()"
          type="button"
          class="p-2 sm:p-2.5 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/80 focus:outline-none transition-all duration-300 cursor-pointer"
          aria-label="Toggle theme"
        >
          <!-- Sun Icon (visible in Dark Mode) -->
          <svg *ngIf="isDarkMode" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21M4.22 4.22l1.58 1.58m12.4 12.4l1.58 1.58M3 12h2.25m13.5 0H21M4.22 19.78l1.58-1.58m12.4-12.4l1.58-1.58M12 7.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z" />
          </svg>
          <!-- Moon Icon (visible in Light Mode) -->
          <svg *ngIf="!isDarkMode" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>

        <!-- User Profile Dropdown (Works on Mobile & Desktop) -->
        <div class="relative user-menu-container">
          <button 
            (click)="toggleUserMenu()"
            type="button"
            class="flex items-center space-x-2 p-1.5 sm:pr-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-all duration-300 cursor-pointer"
          >
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-xs font-bold shadow-sm uppercase">
              {{ authService.user()?.name?.charAt(0) || 'A' }}
            </div>
            <span class="hidden sm:inline text-sm font-medium text-slate-700 dark:text-slate-300">{{ authService.user()?.name || 'Admin' }}</span>
            <svg class="w-4 h-4 text-slate-400 transition-transform duration-200" [class.rotate-180]="showUserMenu" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
          
          <!-- Dropdown Menu -->
          <div 
            *ngIf="showUserMenu"
            class="absolute right-0 top-full mt-2 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/50 rounded-xl shadow-xl shadow-black/10 dark:shadow-black/30 py-2 z-50 animate-in fade-in zoom-in-95 duration-150"
          >
            <div class="px-4 py-2.5 border-b border-slate-100 dark:border-slate-800">
              <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ authService.user()?.name || 'Admin' }}</p>
              <p class="text-xs text-slate-500 dark:text-slate-400 capitalize">{{ authService.user()?.role || 'User' }}</p>
            </div>
            <button 
              (click)="openChangePassword()"
              class="w-full flex items-center space-x-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors duration-200 cursor-pointer"
            >
              <svg class="w-4.5 h-4.5 text-slate-500 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
              </svg>
              <span>Change Password</span>
            </button>
            <button 
              (click)="openSettings()"
              class="w-full flex items-center space-x-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors duration-200 cursor-pointer"
            >
              <svg class="w-4.5 h-4.5 text-slate-500 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>Backup & Settings</span>
            </button>
            <div class="border-t border-slate-100 dark:border-slate-800 my-1"></div>
            <button 
              (click)="onLogout()"
              class="w-full flex items-center space-x-3 px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors duration-200 cursor-pointer"
            >
              <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>

        <!-- Mobile Hamburger Button -->
        <button 
          (click)="toggleMobileMenu()"
          type="button" 
          class="lg:hidden inline-flex items-center justify-center p-2 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-emerald-500 transition-all duration-300 ml-1"
          aria-label="Open menu"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

      </div>

    </div>
  </div>


</header>

<app-change-password-modal
  [isOpen]="isChangePasswordOpen()"
  (close)="isChangePasswordOpen.set(false)"
></app-change-password-modal>
