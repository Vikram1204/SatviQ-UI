<div class="scanner-overlay fixed inset-0 z-[200] bg-black/95 flex flex-col items-center justify-center">
  
  <!-- Header Bar -->
  <div class="absolute top-0 left-0 right-0 z-10 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/80 to-transparent">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center">
        <svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75ZM6.75 16.5h.75v.75h-.75v-.75ZM16.5 6.75h.75v.75h-.75v-.75ZM13.5 13.5h.75v.75h-.75v-.75ZM13.5 19.5h.75v.75h-.75v-.75ZM19.5 13.5h.75v.75h-.75v-.75ZM19.5 19.5h.75v.75h-.75v-.75ZM16.5 16.5h.75v.75h-.75v-.75Z" />
        </svg>
      </div>
      <span class="text-white font-semibold text-sm">Scan Animal Tag</span>
    </div>
    <button 
      (click)="onClose()" 
      class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-all duration-200 cursor-pointer"
      aria-label="Close scanner"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Camera View -->
  <div class="relative w-full max-w-lg mx-auto flex-1 flex items-center justify-center px-4">
    
    <!-- Video Element -->
    <video 
      #videoElement 
      class="w-full max-h-[70vh] object-cover rounded-2xl"
      playsinline 
      muted 
      autoplay
    ></video>

    <!-- Viewfinder Overlay -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none" *ngIf="status() === 'scanning'">
      <div class="viewfinder relative w-64 h-40 sm:w-72 sm:h-44">
        <!-- Corner brackets -->
        <div class="absolute top-0 left-0 w-8 h-8 border-t-3 border-l-3 border-emerald-400 rounded-tl-lg"></div>
        <div class="absolute top-0 right-0 w-8 h-8 border-t-3 border-r-3 border-emerald-400 rounded-tr-lg"></div>
        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-3 border-l-3 border-emerald-400 rounded-bl-lg"></div>
        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-3 border-r-3 border-emerald-400 rounded-br-lg"></div>
        
        <!-- Animated scan line -->
        <div class="scan-line absolute left-2 right-2 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_8px_rgba(16,185,129,0.6)]"></div>
      </div>
    </div>

    <!-- Success Flash Overlay -->
    <div 
      *ngIf="status() === 'success'" 
      class="absolute inset-0 flex items-center justify-center bg-emerald-500/20 rounded-2xl success-flash"
    >
      <div class="w-20 h-20 rounded-full bg-emerald-500 flex items-center justify-center shadow-xl shadow-emerald-500/50">
        <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="absolute bottom-0 left-0 right-0 z-10 bg-gradient-to-t from-black/80 to-transparent px-4 pb-8 pt-16">
    
    <!-- Status Message -->
    <div class="text-center mb-4">
      <div class="flex items-center justify-center space-x-2">
        <!-- Scanning indicator -->
        <span 
          *ngIf="status() === 'scanning'" 
          class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"
        ></span>
        <!-- Error indicator -->
        <span 
          *ngIf="status() === 'error'" 
          class="w-2.5 h-2.5 rounded-full bg-red-400"
        ></span>
        <!-- Success indicator -->
        <span 
          *ngIf="status() === 'success'" 
          class="w-2.5 h-2.5 rounded-full bg-emerald-400"
        ></span>
        <!-- Loading indicator -->
        <svg 
          *ngIf="status() === 'initializing'" 
          class="animate-spin w-4 h-4 text-white" 
          fill="none" 
          viewBox="0 0 24 24"
        >
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>

        <span class="text-white text-sm font-medium">{{ statusMessage() }}</span>
      </div>

      <!-- Scanned value display -->
      <div *ngIf="scannedValue()" class="mt-2 px-4 py-2 bg-emerald-500/20 rounded-xl border border-emerald-500/30 inline-block">
        <span class="text-emerald-300 text-sm font-mono font-bold">{{ scannedValue() }}</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-center space-x-3">
      <button 
        *ngIf="status() === 'error'" 
        (click)="onRetry()" 
        class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl transition-all duration-200 cursor-pointer"
      >
        Retry
      </button>
      <button 
        (click)="onClose()" 
        class="px-6 py-2.5 bg-white/10 hover:bg-white/20 text-white text-sm font-semibold rounded-xl transition-all duration-200 cursor-pointer"
      >
        Cancel
      </button>
    </div>
  </div>

</div>
